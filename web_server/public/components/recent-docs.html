<!-- ============================================================
   OpenRouter Study Document Viewer — Recent Documents List Component
   Path: public/components/recent-docs.html
   Design tokens: --color-*, --space-*, --radius-*, --shadow-*, .text-*
   Accessibility: aria-label, role="list"/role="listitem", links/buttons,
                  focus-visible, Korean text, empty state with action.
   Drop-in: call RecentDocs.init(container, options) or mark with data-recent-docs.
   ============================================================ -->

<template id="tmpl-recent-docs">
  <section class="rd-root" aria-label="최근 문서">
    <h2 class="rd-heading">최근 문서</h2>
    <ul class="rd-list" role="list"></ul>
    <p class="rd-empty" hidden>최근 문서가 없습니다.</p>
  </section>
</template>

<style>
  .rd-root { display: flex; flex-direction: column; gap: var(--space-s); }
  .rd-heading { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; color: hsl(var(--color-text-muted)); text-transform: uppercase; margin: 0; }
  .rd-list { display: flex; flex-direction: column; gap: var(--space-xs); margin: 0; padding: 0; list-style: none; }
  .rd-item { display: flex; align-items: center; justify-content: space-between; gap: var(--space-m); padding: var(--space-xs) var(--space-m); background: hsl(var(--color-surface-elev)); border: 1px solid hsl(var(--color-border)); border-radius: var(--radius-md); cursor: pointer; min-height: 44px; transition: background 150ms ease, border-color 150ms ease; }
  .rd-item:hover { background: hsl(var(--color-surface-elev) / 0.8); border-color: hsl(var(--color-accent)); }
  .rd-item:focus-visible { outline: 2px solid hsl(var(--color-focus)); outline-offset: 2px; border-color: hsl(var(--color-focus)); }
  .rd-item a { color: inherit; text-decoration: none; display: block; flex: 1; min-width: 0; }
  .rd-title { font-size: 0.9375rem; font-weight: 600; color: hsl(var(--color-text-primary)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rd-meta { font-size: 0.75rem; color: hsl(var(--color-text-muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: var(--space-s); flex-shrink: 0; }
  .rd-time { font-size: 0.75rem; color: hsl(var(--color-text-muted)); white-space: nowrap; flex-shrink: 0; }
  .rd-empty { font-size: 0.875rem; color: hsl(var(--color-text-muted)); text-align: center; padding: var(--space-m); }
  @media (prefers-reduced-motion: reduce) { .rd-item { transition: none; } }
</style>

<script>
(function () {
  'use strict';

  var ESC_HTML = (function () {
    var div = document.createElement('div');
    return function (text) {
      div.textContent = text;
      return div.innerHTML;
    };
  })();

  var RecentDocs = {
    container: null,
    list: null,
    empty: null,
    onSelect: null,
    items: [],

    init: function (container, options) {
      options = options || {};
      this.container = typeof container === 'string' ? document.querySelector(container) : container;
      if (!this.container) return this;

      var tpl = document.getElementById('tmpl-recent-docs');
      if (tpl && !this.container.querySelector('.rd-root')) {
        this.container.innerHTML = '';
        this.container.appendChild(document.importNode(tpl.content, true));
      }

      this.list = this.container.querySelector('.rd-list');
      this.empty = this.container.querySelector('.rd-empty');
      this.onSelect = options.onSelect || null;

      if (!this.list) return this;

      var self = this;
      this.list.addEventListener('click', function (e) {
        var link = e.target.closest('a');
        if (!link) return;
        e.preventDefault();
        var idx = Number(link.dataset.index);
        self.select(idx);
      });
      this.list.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          var link = e.target.closest('a');
          if (link) { e.preventDefault(); link.click(); }
        }
      });

      if (options.items) this.render(options.items);
      return this;
    },

    render: function (items) {
      this.items = items || [];
      if (!this.list) return;
      this.list.innerHTML = '';
      if (this.items.length === 0) {
        if (this.empty) this.empty.removeAttribute('hidden');
        return;
      }
      if (this.empty) this.empty.setAttribute('hidden', '');
      this.items.forEach(function (it, idx) {
        var li = document.createElement('li');
        li.className = 'rd-item';
        li.setAttribute('role', 'listitem');
        var title = ESC_HTML(it.title || it.name || '');
        var meta = it.subtitle ? ESC_HTML(it.subtitle) : '';
        var time = it.time ? ESC_HTML(it.time) : '';
        var href = it.path ? ('#' + ESC_HTML(String(it.path))) : '#';
        li.innerHTML =
          '<a href="' + href + '" data-index="' + idx + '" tabindex="0">' +
          '  <div class="rd-title">' + title + '</div>' +
          (meta ? '<span class="rd-meta">' + meta + '</span>' : '') +
          '</a>' +
          (time ? '<span class="rd-time">' + time + '</span>' : '');
        this.list.appendChild(li);
      }, this);
    },

    select: function (idx) {
      var item = this.items[idx];
      if (!item) return;
      if (typeof this.onSelect === 'function') this.onSelect(item);
    },

    update: function (items) {
      this.render(items);
      return this;
    },

    destroy: function () {
      this.container = null;
      this.list = null;
      this.empty = null;
      this.onSelect = null;
      this.items = [];
    }
  };

  window.RecentDocs = window.RecentDocs || RecentDocs;

  document.addEventListener('DOMContentLoaded', function () {
    var auto = document.querySelector('[data-recent-docs]');
    if (auto) {
      try {
        RecentDocs.init(auto, { items: JSON.parse(auto.getAttribute('data-recent-docs') || '[]') });
      } catch (e) {
        RecentDocs.init(auto, { items: [] });
      }
    }
  });
})();
</script>

     <script>
       RecentDocs.init('#recent', {

       });
