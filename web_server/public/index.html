<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Study Document Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#grid" class="skip-link">문서 그리드로 건너뛰기</a>

  <div class="layout">
    <aside class="sidebar glass" aria-label="폴더 네비게이션">
      <div class="brand glass-panel">
        <h2>OpenRouter</h2>
        <p>Study Document Viewer</p>
      </div>
      <nav class="nav glass-panel">
        <h3>폴더</h3>
        <button class="nav-item active glass-item" data-root="open_router" type="button">open_router/doc</button>
        <button class="nav-item glass-item" data-root="study" type="button">study/01_skill_claude</button>
      </nav>
      <div class="search-box glass-panel">
        <label for="searchInput" class="visually-hidden">문서 검색</label>
        <input type="text" id="searchInput" aria-label="문서 검색" placeholder="문서 검색...">
        <button id="searchBtn" type="button" aria-label="검색 실행">검색</button>
      </div>
      <div class="status" id="status" aria-live="polite">준비</div>
    </aside>

    <main class="main">
      <header class="header glass-panel">
        <h1 id="pageTitle">문서 목록</h1>
        <div class="breadcrumb" id="breadcrumb"></div>
      </header>

      <div class="toolbar glass-panel">
        <button id="addBtn" type="button" class="glass-key" aria-label="추가">+</button>
        <button id="refreshBtn" type="button">새로고침</button>
        <span class="divider"></span>
        <span id="docCount" class="glass-label">0개 문서</span>
        <button id="moreBtn" type="button" class="glass-key" aria-label="더보기">···</button>
      </div>

      <div class="grid" id="grid" role="region" aria-label="문서 목록"></div>

      <div class="viewer-overlay glass" id="viewerOverlay" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" aria-hidden="true">
        <div class="viewer-panel glass-panel">
          <div class="viewer-header glass-panel">
            <h2 id="viewerTitle"></h2>
            <div class="viewer-actions">
              <button id="copyBtn" type="button">복사</button>
              <button id="closeViewerBtn" type="button" aria-label="뷰어 닫기">닫기</button>
            </div>
          </div>
          <div class="viewer-content" id="viewerContent"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
