name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # Node.js 환경 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 테스트 실행
      - name: Run tests
        run: npm test || echo "No tests configured"

      # Docker 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-doc-viewer:latest

      # 대상 서버에 배포
      - name: Deploy to target server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-doc-viewer:latest
            docker stop openrouter-doc-viewer || true
            docker rm openrouter-doc-viewer || true
            docker run -d --name openrouter-doc-viewer -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/openrouter-doc-viewer:latest
